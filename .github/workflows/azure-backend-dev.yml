# Builds the backend Docker image, pushes it to GitHub Container Registry (ghcr.io)
# and updates the Azure Container App whenever dev is updated.
#
# Azure login uses OpenID Connect with a user-assigned managed identity
# (hh-secur-be-github in hh-secur-i-rg), so no client secret is stored in GitHub.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   AZURE_CLIENT_ID        client ID of the managed identity
#   AZURE_TENANT_ID        Azure tenant ID
#   AZURE_SUBSCRIPTION_ID  Azure for Students subscription ID

name: Deploy backend to Azure (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: azure-backend-dev
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/haagahelia/hh-secur-be
  RESOURCE_GROUP: hh-secur-i-rg
  CONTAINER_APP: hh-secur-be-dev

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App to the new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --only-show-errors \
            --query "properties.configuration.ingress.fqdn" -o tsv
